<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าหลัก (Portfolio Index) - วรรธนันท์ อุดมเดชภาคินทร์</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Great+Vibes&display=swap');

* { box-sizing: border-box; }
body {
    font-family: 'Sarabun', sans-serif;
    margin: 0;
    padding: 30px 15px;
    background: url('IMG_4643.jpeg') center center / cover no-repeat fixed;
    min-height: 100vh;
    color: #2b2b2b;
}

.container {
    max-width: 860px;
    margin: auto;
    position: relative;
    z-index: 1;
}

.header-wrapper {
    text-align: center;
    margin-bottom: 25px;
}

.profile-card {
    width: 135px;
    height: 135px;
    margin: 0 auto 18px auto;
    border-radius: 50%;
    background: linear-gradient(135deg, #FF80AB, #CE93D8, #80DEEA);
    padding: 3px;
    box-shadow: 0 10px 25px -5px rgba(233, 30, 99, 0.25);
}

.profile-card img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ffffff;
    background-color: #ffffff;
}

.main-title {
    font-family: 'Great Vibes', cursive;
    font-size: 76px;
    margin: 0;
    color: #E91E63;
    font-weight: normal;
    text-shadow: 3px 3px 0px #D1C4E9;
}

.sub-name {
    font-size: 20px;
    font-weight: 600;
    color: #4a4a4a;
    margin-top: 8px;
}

.box {
    background: rgba(255, 255, 255, 0.95);
    padding: 35px 30px;
    border-radius: 30px;
    border: 5px dashed #F06292;
    outline: 5px solid #ffffff;
    box-shadow: 8px 8px 0px #F8BBD0;
    text-align: center;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 25px;
}

.menu-card {
    background: #ffffff;
    border: 2px solid #CE93D8;
    border-radius: 20px;
    padding: 20px;
    text-decoration: none;
    color: #AB47BC;
    font-weight: 700;
    font-size: 18px;
    box-shadow: 3px 3px 0px #B39DDB;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.menu-card:hover {
    background: #CE93D8;
    color: #ffffff;
    transform: translateY(-3px);
    box-shadow: 4px 4px 0px #81D4FA;
}

.menu-card span {
    font-size: 28px;
}

.footer {
    text-align: center;
    font-size: 26px;
    color: #424242;
    margin-top: 30px;
    background: rgba(255, 255, 255, 0.8);
    padding: 12px;
    border-radius: 20px;
    font-family: 'Great Vibes', cursive;
}
</style>
</head>
<body>

<div class="container">
    <div class="header-wrapper">
        <div class="profile-card">
            <img src="IMG_4109.png" alt="รูปโปรไฟล์">
        </div>
        <h1 class="main-title">Portfolio</h1>
        <div class="sub-name">วรรธนันท์ อุดมเดชภาคินทร์</div>
    </div>

    <div class="box">
        <h2 style="color: #AB47BC; margin-top:0;">✨🌸 ยินดีต้อนรับเข้าสู่แฟ้มสะสมผลงาน 🌸✨</h2>
        <p style="color: #666;">กรุณาเลือกหัวข้อที่ต้องการรับชม</p>
        
        <div class="menu-grid">
            <a href="introduction.html" class="menu-card">
                <span>📝</span>
                1. คำนำ
            </a>
            <a href="profile.html" class="menu-card">
                <span>👤</span>
                2. ประวัติส่วนตัว & การศึกษา
            </a>
            <a href="university.html" class="menu-card">
                <span>🎓</span>
                3. ความสนใจในการศึกษาต่อ
            </a>
            <a href="projects.html" class="menu-card">
                <span>🏆</span>
                4. กิจกรรมที่เข้าร่วม
            </a>
            <a href="skill.html" class="menu-card">
                <span>💡</span>
                5. ทักษะความสามารถ
            </a>
        </div>
    </div>

    <div class="footer">
        © Portfolio - Wantanan Udomdetphakin
    </div>
</div>

</body>
</html>
