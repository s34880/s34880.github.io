<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แฟ้มสะสมผลงาน (Portfolio) - วรรธนันท์ อุดมเดชภาคินทร์</title>
<style>
/* นำเข้าฟอนต์ Google Fonts: Great Vibes (คำว่า Portfolio), Baloo 2 และ Mali (เนื้อหา) */
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Great+Vibes&family=Mali:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap');

* {
    box-sizing: border-box;
}

body {
    font-family: 'Mali', cursive, sans-serif;
    margin: 0;
    padding: 30px 15px;
    background: linear-gradient(135deg, #F3E5F5 0%, #E1F5FE 50%, #FCE4EC 100%);
    position: relative;
    overflow-x: hidden;
    min-height: 100vh;
    color: #2b2b2b;
}

/* ลวดลายพื้นหลังขยับได้เบาๆ โดยไม่เปลี่ยนสี */
body::before,
body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    z-index: 0;
    pointer-events: none;
}

body::before {
    width: 420px;
    height: 420px;
    top: -120px;
    left: -100px;
    background: rgba(255, 209, 220, 0.55);
    animation: drift-one 22s ease-in-out infinite;
}

body::after {
    width: 380px;
    height: 380px;
    bottom: -100px;
    right: -100px;
    background: rgba(179, 229, 252, 0.55);
    animation: drift-two 26s ease-in-out infinite;
}

@keyframes drift-one {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, 40px) scale(1.15); }
}

@keyframes drift-two {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-50px, -30px) scale(1.15); }
}

.container {
    max-width: 860px;
    margin: auto;
    position: relative;
    z-index: 1;
}

/* ส่วนหัวโปรไฟล์ */
.header-wrapper {
    text-align: center;
    margin-bottom: 25px;
}

.profile-card {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px auto;
    border: 5px solid #FF80AB;
    box-shadow: 6px 6px 0px #80DEEA, -5px -5px 0px #CE93D8;
    transition: transform 0.3s ease;
}

.profile-card:hover {
    transform: rotate(5deg) scale(1.05);
}

.profile-card img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #A7FFEB;
    object-fit: cover;
}

/* หัวข้อ Portfolio ใช้ฟอนต์ Great Vibes */
.main-title {
    font-family: 'Great Vibes', cursive;
    font-size: 76px;
    margin: 0;
    color: #E91E63;
    font-weight: normal;
    line-height: 1;
    letter-spacing: 1px;
    text-shadow: 3px 3px 0px #D1C4E9, 0 0 15px rgba(255, 64, 129, 0.4);
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from {
        text-shadow: 2px 2px 0px #D1C4E9, 0 0 10px rgba(255, 128, 171, 0.5);
    }
    to {
        text-shadow: 3px 3px 0px #D1C4E9, 0 0 20px rgba(255, 64, 129, 0.8), 0 0 30px #FF80AB;
    }
}

.sub-name {
    font-size: 20px;
    font-weight: 600;
    color: #4a4a4a;
    margin-top: 8px;
    letter-spacing: 0.5px;
}

/* แถบเมนูนำทาง (Tabs Navigation) */
.nav-tabs {
    display: flex;
    justify-content: center;
    overflow-x: auto;
    gap: 10px;
    padding: 10px 5px;
    margin-bottom: 20px;
}

.nav-tabs::-webkit-scrollbar {
    height: 6px;
}
.nav-tabs::-webkit-scrollbar-thumb {
    background-color: #CE93D8;
    border-radius: 10px;
}
