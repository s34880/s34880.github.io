<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าแนะนำตัวของฉัน - Wantanan</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Reset & Custom Properties */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
    }

    /* Animated Gradient Background */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #ff75ba, #8e44ad, #2980b9, #2ecc71);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      padding: 20px;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glassmorphism Card Container */
    .card-wrapper {
      position: relative;
      max-width: 480px;
      width: 100%;
      border-radius: 28px;
      padding: 3px; /* For animated border */
      background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0.05));
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      animation: fadeInUp 1s ease-out;
    }

    .card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 40px 30px;
      text-align: center;
      color: #1f2937;
    }

    /* Profile Image Style */
    .profile-img-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      transition: transform 0.4s ease;
    }

    .card:hover .profile-img {
      transform: scale(1.05) rotate(3deg);
    }

    /* Typography */
    h1 {
      font-size: 1.65rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #334155;
      margin-bottom: 12px;
      font-weight: 300;
    }

    p strong {
      font-weight: 600;
      color: #0f172a;
    }

    /* Tag Badge Style */
    .tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.6);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 400;
      color: #475569;
      margin-top: 4px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Interactive Portfolio Button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
      padding: 12px 32px;
      background: #ffffff;
      color: #2563eb;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
      background: #2563eb;
      color: #ffffff;
    }

    .btn:active {
      transform: translateY(-1px);
    }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card-wrapper">
    <div class="card">
      <div class="profile-img-container">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Wantanan" alt="Wantanan Profile" class="profile-img">
      </div>

      <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน ✨</h1>
      
      <p>สวัสดีงับ! ดิฉันชื่อ <strong>วรรธนันท์ (Wantanan)</strong></p>
      
      <p>ขณะนี้กำลังศึกษา/สนใจด้าน<br>
        <span class="tag"><i class="fa-solid fa-code"></i> Computer Science & Engineering</span>
      </p>
      
      <p style="font-size: 0.9rem; margin-top: 15px;">
        <i class="fa-brands fa-github"></i> เว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages!
      </p>

      <a href="portfolio.html" class="btn">
        <i class="fa-solid fa-folder-open"></i> แฟ้มสะสมผลงาน
      </a>
    </div>
  </div>

</body>
</html>
