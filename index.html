<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแนะนำตัวของวรรธนันท์ 🍭</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Great+Vibes&family=Prompt:wght@300;400;600&display=swap">
<style>
  /* กำหนดชื่อ Class สำหรับฟอนต์ Heart Script สไตล์ภาพที่ส่งมา */
  .heart-font {
    font-family: 'Great Vibes', 'Alex Brush', cursive;
  }

  :root {
    --pink-soft: #ffe5ec;
    --pink-main: #ffb3c6;
    --pink-accent: #ff85a1;
    --pink-dark: #fb6f92;
    --purple-soft: #e2afff;
    --text-color: #6c4f70;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    /* พื้นหลังสีชมพูไล่เฉดหวานๆ */
    background: radial-gradient(circle at 20% 20%, #fff0f5 0%, #ffc6ff 40%, #ffb3c6 80%, #ff85a1 100%);
    background-size: 200% 200%;
    animation: pinkGradient 10s ease infinite alternate;
    font-family: 'Prompt', sans-serif;
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  @keyframes pinkGradient {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  /* ------------------- เอฟเฟกต์ตกแต่งตกลงมา ------------------- */
  .falling-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .falling-item {
    position: absolute;
    top: -50px;
    font-size: 24px;
    animation: fall linear infinite;
    user-select: none;
  }

  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg) scale(0.8);
      opacity: 1;
    }
    50% {
      transform: translateY(50vh) rotate(180deg) scale(1.2);
    }
    100% {
      transform: translateY(105vh) rotate(360deg) scale(0.8);
      opacity: 0.2;
    }
  }

  .falling-item:nth-child(1)  { left: 5%;  animation-duration: 6s;  animation-delay: 0s; }
  .falling-item:nth-child(2)  { left: 18%; animation-duration: 8s;  animation-delay: 2s; }
  .falling-item:nth-child(3)  { left: 28%; animation-duration: 7s;  animation-delay: 4s; }
  .falling-item:nth-child(4)  { left: 40%; animation-duration: 9s;  animation-delay: 1s; }
  .falling-item:nth-child(5)  { left: 52%; animation-duration: 6.5s; animation-delay: 3s; }
  .falling-item:nth-child(6)  { left: 65%; animation-duration: 8.5s; animation-delay: 0.5s; }
  .falling-item:nth-child(7)  { left: 78%; animation-duration: 7.5s; animation-delay: 2.5s; }
  .falling-item:nth-child(8)  { left: 88%; animation-duration: 9.5s; animation-delay: 1.5s; }
  .falling-item:nth-child(9)  { left: 95%; animation-duration: 6.8s; animation-delay: 3.5s; }

  /* ------------------- การ์ดโปรไฟล์ ------------------- */
  .card {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    border: 4px dashed var(--pink-main);
    border-radius: 40px;
    box-shadow: 0 15px 35px rgba(255, 133, 161, 0.3);
    max-width: 480px;
    width: 100%;
    padding: 40px 30px;
    text-align: center;
    position: relative;
    z-index: 2;
    animation: floatCard 3.5s ease-in-out infinite alternate;
  }

  /* การ์ดลอยขึ้น-ลงนุ่มนวล */
  @keyframes floatCard {
    0% { transform: translateY(0px) rotate(-0.5deg); }
    100% { transform: translateY(-12px) rotate(0.5deg); }
  }

  /* ------------------- รูปโปรไฟล์แบบดุ๊กดิ๊ก ------------------- */
  .avatar-wrapper {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 20px auto;
  }

  .avatar-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 4px dashed var(--pink-accent);
    padding: 4px;
    background: #fff;
    box-shadow: 0 8px 20px rgba(251, 111, 146, 0.25);
    /* เอฟเฟกต์ดุ๊กดิ๊กตลอดเวลา */
    animation: avatarBounce 2.5s ease-in-out infinite alternate;
    cursor: pointer;
    transition: transform 0.3s;
  }

  /* เอฟเฟกต์เด้งสั่นดุ๊กดิ๊ก */
  @keyframes avatarBounce {
    0% { transform: translateY(0) scale(1) rotate(0deg); }
    30% { transform: translateY(-6px) scale(1.03) rotate(-3deg); }
    60% { transform: translateY(0) scale(0.98) rotate(3deg); }
    100% { transform: translateY(-10px) scale(1.05) rotate(-2deg); }
  }

  .avatar-img:hover {
    animation: wiggle 0.4s ease-in-out infinite alternate;
  }

  @keyframes wiggle {
    0% { transform: rotate(-12deg) scale(1.12); }
    100% { transform: rotate(12deg) scale(1.12); }
  }

  h1 {
    font-family: 'Great Vibes', 'Prompt', cursive;
    color: var(--pink-dark);
    font-size: 32px;
    margin-bottom: 15px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  p {
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 16px;
  }

  .highlight {
    background: linear-gradient(120deg, #ffe5ec 0%, #ffc6ff 100%);
    padding: 3px 12px;
    border-radius: 15px;
    font-weight: 600;
    color: var(--pink-dark);
    display: inline-block;
    animation: pulseHighlight 2s infinite alternate;
  }

  /* ตกแต่งตัวอักษรภาษาอังกฤษด้วยฟอนต์ Heart Script */
  .heart-text {
    font-family: 'Great Vibes', cursive;
    font-size: 1.25em;
    font-weight: normal;
  }

  @keyframes pulseHighlight {
    0% { transform: scale(1); }
    100% { transform: scale(1.05); }
  }

  /* ------------------- ปุ่มกดขยับดุ๊กดิ๊ก ------------------- */
  .btn {
    display: inline-block;
    background: linear-gradient(45deg, var(--pink-main), var(--purple-soft));
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 30px;
    box-shadow: 0 8px 20px rgba(255, 179, 198, 0.6);
    transition: all 0.3s ease;
    margin-top: 15px;
    border: 2px dashed #ffffff;
    /* เอฟเฟกต์ปุ่มสั่นไหวดุ๊กดิ๊ก */
    animation: btnPulse 3s ease-in-out infinite;
  }

  @keyframes btnPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04) rotate(1deg); }
  }

  .btn:hover {
    transform: scale(1.12) rotate(-3deg) !important;
    box-shadow: 0 12px 25px rgba(251, 111, 146, 0.5);
    background: linear-gradient(45deg, var(--purple-soft), var(--pink-dark));
  }

  /* ------------------- โซเชียลมีเดียดุ๊กดิ๊ก ------------------- */
  .social-links {
    margin-top: 25px;
    font-size: 24px;
  }

  .social-links a {
    color: var(--text-color);
    text-decoration: none;
    margin: 0 12px;
    display: inline-block;
    transition: transform 0.2s;
    animation: floatSocial 2s ease-in-out infinite alternate;
  }

  .social-links a:nth-child(1) { animation-delay: 0s; }
  .social-links a:nth-child(2) { animation-delay: 0.3s; }
  .social-links a:nth-child(3) { animation-delay: 0.6s; }

  @keyframes floatSocial {
    0% { transform: translateY(0); }
    100% { transform: translateY(-5px) rotate(5deg); }
  }

  .social-links a:hover {
    transform: scale(1.5) rotate(15deg) !important;
  }
</style>
</head>
<body>

<div class="falling-container">
  <div class="falling-item">✨</div>
  <div class="falling-item">🌸</div>
  <div class="falling-item">💖</div>
  <div class="falling-item">🍬</div>
  <div class="falling-item">⭐</div>
  <div class="falling-item">🎀</div>
  <div class="falling-item">🍭</div>
  <div class="falling-item">✨</div>
  <div class="falling-item">🍓</div>
</div>

<div class="card">
  <div class="avatar-wrapper">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="รูปโปรไฟล์วรรธนันท์" class="avatar-img" title="ลองแตะสิ!">
  </div>
  
  <h1 class="heart-font">Welcome to My Profile ✨</h1>
  <p>สวัสดีค่ะ! ดิฉันชื่อ <span class="highlight">วรรธนันท์ (<span class="heart-text">Wantanan</span>)</span> 🎀</p>
  <p>ขณะนี้กำลังสนใจด้าน <br><strong class="heart-text" style="font-size: 1.15em;">Computer Science & Engineering 💻✨</strong></p>
  
  <a href="portfolio.html" class="btn">✨🎀 แฟ้มสะสมผลงาน 🪽✨</a>

  <div class="social-links">
    <a href="#" title="GitHub">🌷</a>
    <a href="#" title="Instagram">🌦️</a>
    <a href="#" title="Sweet">☔️</a>
  </div>
</div>

</body>
</html>
