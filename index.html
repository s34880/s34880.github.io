<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแนะนำตัวสุดน่ารักของวรรธนันท์ 🍭</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;600&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ffc6ff;
    --purple: #bdb2ff;
    --blue: #a0c4ff;
    --yellow: #fdffb6;
    --text-color: #5c4d7d;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue), var(--yellow));
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    font-family: 'Prompt', sans-serif;
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border: 4px solid #ffffff;
    border-radius: 35px;
    box-shadow: 0 15px 35px rgba(189, 178, 255, 0.4);
    max-width: 480px;
    width: 100%;
    padding: 40px 30px;
    text-align: center;
    position: relative;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }

  .avatar {
    font-size: 65px;
    background: var(--yellow);
    width: 110px;
    height: 110px;
    line-height: 110px;
    border-radius: 50%;
    margin: 0 auto 15px auto;
    box-shadow: 0 8px 15px rgba(0,0,0,0.08);
    border: 3px solid #fff;
  }

  h1 {
    color: #6b4c9a;
    font-size: 24px;
    margin-bottom: 15px;
    font-weight: 600;
  }

  p {
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 12px;
  }

  .highlight {
    background: linear-gradient(120deg, #ffc6ff 0%, #ffffb5 100%);
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 600;
  }

  .badge-container {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 20px 0;
  }

  .badge {
    background: #ffffff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border: 1px solid var(--purple);
  }

  .btn {
    display: inline-block;
    background: linear-gradient(45deg, #ffb3c6, #bdb2ff);
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 25px;
    box-shadow: 0 8px 20px rgba(255, 179, 198, 0.5);
    transition: all 0.3s ease;
    margin-top: 10px;
    border: 2px solid #ffffff;
  }

  .btn:hover {
    transform: scale(1.08) rotate(-2deg);
    box-shadow: 0 12px 25px rgba(189, 178, 255, 0.7);
    background: linear-gradient(45deg, #bdb2ff, #ffb3c6);
  }

  .social-links {
    margin-top: 25px;
    font-size: 20px;
  }

  .social-links a {
    color: var(--text-color);
    text-decoration: none;
    margin: 0 8px;
    transition: transform 0.2s;
    display: inline-block;
  }

  .social-links a:hover {
    transform: scale(1.3);
  }
</style>
</head>
<body>

<div class="card">
  <div class="avatar">🧁</div>
  <h1>ยินดีต้อนรับสู่พาร์คหวานๆ ของฉัน ✨</h1>
  
  <p>สวัสดีงับ! ดิฉันชื่อ <span class="highlight">วรรธนันท์ (Wantanan)</span> 🎀</p>
  <p>กำลังหลงรักโลกของ <br><strong>Computer Science & Engineering 💻✨</strong></p>
  
  <div class="badge-container">
    <span class="badge">🍰 Web Dev</span>
    <span class="badge">คุ้กกี้ 🍪</span>
    <span class="badge">GitHub Pages 🚀</span>
  </div>

  <p style="font-size: 14px; color: #7a68a6;">
    เว็บไซต์แรกสุดน่ารักที่โฮสต์บน GitHub Pages! 🍓
  </p>
  
  <a href="portfolio.html" class="btn">🎀 แฟ้มสะสมผลงาน 🍩</a>

  <div class="social-links">
    <a href="#" title="GitHub">🐱</a>
    <a href="#" title="Instagram">📷</a>
    <a href="#" title="Contact">เนยสด 🧈</a>
  </div>
</div>

</body>
</html>
